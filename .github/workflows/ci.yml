name: CI

on:
  push:
    branches: [ "main", "port/**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, Android-SDK-free gate: the pure-Kotlin domain + analysis core.
  # These tests hold the load-bearing math (river decomposition, dedup,
  # classifier evidence, lens fidelity guard, CVD palette) and must be green.
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared core + data layer unit tests (JVM)
        run: ./gradlew :core:model:jvmTest :core:data:jvmTest :core:inference-api:jvmTest

      # The same tests, compiled to a native Linux binary by Kotlin/Native. This is what
      # keeps the core free of JVM-only APIs: the JVM build alone happily accepts them.
      # linuxArm64 (Ubuntu Touch phones) is compiled too; it cannot run on this host.
      - name: Shared core + data layer unit tests (native Linux)
        run: |
          # The native HTTP transport is tested against a local server; its port reaches the test binary by env var.
          python3 tools/native/testserver.py > /tmp/testserver.port &
          for _ in $(seq 50); do [ -s /tmp/testserver.port ] && break; sleep 0.1; done
          export NOOZ_TEST_HTTP_PORT=$(head -1 /tmp/testserver.port)
          ./gradlew :core:model:linuxX64Test :core:data:linuxX64Test :core:inference-api:linuxX64Test :core:model:compileKotlinLinuxArm64 :core:data:compileKotlinLinuxArm64 :core:inference-api:compileKotlinLinuxArm64

  # The Linux desktop app: the Compose UI tests (locale resolution, accessibility semantics, and the
  # adaptive layout at phone / tablet / desktop / ultrawide widths, run against the real app with a
  # real feed), then the installable packages. Compose needs a display even when nothing is shown,
  # so the tests run under xvfb.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # No Android SDK on this job's path: the Android targets are switched off.
      - name: Desktop UI tests
        run: xvfb-run -a ./gradlew -Pnooz.skipAndroid=true :core:design:jvmTest :feature:river:jvmTest :desktop:test
      - name: Generated translations are current
        run: python3 tools/i18n/generate.py --check
      - name: Interface copy is translatable
        run: ./gradlew -Pnooz.skipAndroid=true verifyI18n
      - name: Layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-layout-screenshots
          path: desktop/build/screenshots/*.png
          if-no-files-found: warn
      - name: Package tools
        run: sudo apt-get install -y fakeroot
      - name: Package (.deb and portable app image)
        run: ./gradlew -Pnooz.skipAndroid=true :desktop:packageDeb :desktop:createDistributable
      - name: Portable tarball
        run: tar -C desktop/build/compose/binaries/main/app -czf nooz-linux-x86_64.tar.gz nooz
      - uses: actions/upload-artifact@v4
        with:
          name: nooz-linux-deb
          path: desktop/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nooz-linux-portable
          path: nooz-linux-x86_64.tar.gz
          if-no-files-found: error

  # Ubuntu Touch: the Kotlin/Native core as a C library (tested from plain C over real HTTP), the Qt/QML
  # app on top of it, and pictures of the real app at phone / tablet / desktop widths with the layout
  # mode asserted at each. The click package itself is built in the next job.
  ubuntu-touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ xvfb qtbase5-dev qtdeclarative5-dev \
            qml-module-qtquick2 qml-module-qtquick-controls2 qml-module-qtquick-layouts \
            qml-module-qtquick-window2 qml-module-qtquick-templates2
      - name: Build the core library (x86-64 for tests, arm64 for the phone)
        run: ./gradlew -Pnooz.skipAndroid=true :core:native-bridge:linkReleaseSharedLinuxX64 :core:native-bridge:linkReleaseSharedLinuxArm64
      - name: C API end-to-end check
        run: |
          python3 tools/native/testserver.py > /tmp/testserver.port &
          for _ in $(seq 50); do [ -s /tmp/testserver.port ] && break; sleep 0.1; done
          LIB=core/native-bridge/build/bin/linuxX64/releaseShared
          gcc -o /tmp/c_smoke ubuntu-touch/harness/c_smoke.c -ldl
          /tmp/c_smoke $LIB "http://127.0.0.1:$(head -1 /tmp/testserver.port)"
      - name: Build the Qt app
        run: |
          cmake -S ubuntu-touch -B /tmp/utbuild -DNOOZ_TEST_HOOKS=ON \
            -DNOOZ_CORE_DIR=$PWD/core/native-bridge/build/bin/linuxX64/releaseShared
          cmake --build /tmp/utbuild -j4
      - name: App pictures and layout mode at 8 window sizes
        run: xvfb-run -a ubuntu-touch/harness/snapshots.sh /tmp/utbuild/nooz /tmp/utshots
      - name: Upload pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-touch-layout-screenshots
          path: /tmp/utshots/*.png
          if-no-files-found: warn

  # The installable .click for arm64 phones, built by Clickable in its container. Best effort until it
  # has been run on a device: a failure here is reported but does not fail the run.
  ubuntu-touch-click:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Clickable
        run: |
          sudo apt-get update && sudo apt-get install -y docker.io adb python3-pip
          pip3 install --user clickable-ut
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the click package (arm64)
        run: clickable build --arch arm64 --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: nooz-ubuntu-touch-click
          path: build/**/*.click
          if-no-files-found: error

  # The web reader had no CI at all until now — its 6,300 lines of JS shipped
  # unexercised, which is how a topic classifier that could not match any
  # non-Latin script survived unnoticed.
  #
  # Deliberately no install step: these tests use node's built-in test runner
  # and import only local modules, so there is nothing to install. `npm ci`
  # would in fact fail here — web/package.json has no package-lock.json.
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The accessibility tests render the real view modules into a real DOM
      # (linkedom), so the dependencies have to be present -- `npm test` alone
      # used to be enough only because the first test file imported nothing.
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Web reader unit tests
        run: npm test
        working-directory: web

      # Accessibility checked by a real browser rather than by reading source.
      # axe-core catches roughly a third of real barriers -- it is not a
      # substitute for a person with a screen reader, and this repo does not
      # claim it is. But the third it catches is the third that regresses
      # silently: contrast that drifts below 4.5:1 after a palette tweak, an
      # icon button that loses its name, a heading level skipped. Its first run
      # found the entire palette's secondary ink at 3.21:1.
      - name: Install Chromium for the accessibility suite
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Web reader accessibility (axe-core)
        run: npm run test:a11y
        working-directory: web

  # Full Android build: assemble both flavors, unit tests, lint.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner image already ships the Android SDK (ANDROID_HOME). This used
      # to be android-actions/setup-android@v3, which runs `sdkmanager tools` and
      # now dies with "Failed to find package 'tools'" (that legacy package is
      # gone from Google's repository) before any project code is built. All
      # that is actually needed is the licenses accepted and the NDK/CMake versions
      # :core:inference pins. AGP's own on-demand install of those fails here (the SDK
      # directory is root-owned: "Failed to install the following SDK components:
      # cmake;3.22.1"), so install them up front, as root.
      - name: Prepare Android SDK (licenses, NDK, CMake)
        run: |
          SDKM="$(command -v sdkmanager || ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | sudo -E "$SDKM" --licenses > /dev/null || true
          sudo -E "$SDKM" --install "cmake;3.22.1" "ndk;27.2.12479018" > /dev/null
      - uses: gradle/actions/setup-gradle@v4

      # `unitTests` discovers each module's own test task rather than naming
      # them. The previous list -- testDebugUnitTest testFossDebugUnitTest
      # testFullDebugUnitTest -- reads like "all of them" and was not: those are
      # Android variant tasks, and :core:model is a plain kotlin.jvm module
      # whose task is `test`. Its 215 tests, the largest suite in the repo, had
      # never run here. The build was green because everything asked for passed.
      - name: Unit tests (every module)
        run: ./gradlew unitTests

      - name: Lint (foss)
        run: ./gradlew lintFossDebug

      # The i18n ratchet. Not Lint's HardcodedText -- that check reads layout
      # XML, and this app has none, so it passes a codebase where every visible
      # word is a Kotlin literal.
      - name: Interface copy is translatable
        run: ./gradlew verifyI18n

      # strings.xml, locales_config.xml, LocaleCoverage.kt and the web
      # catalogues are all generated from i18n/strings/. Editing a generated
      # file by hand would work locally and be silently reverted by the next
      # run of the generator, so the build refuses to let the two diverge.
      - name: Translations are regenerated from their source
        run: python3 tools/i18n/generate.py --check

      - name: Assemble (both flavors)
        run: ./gradlew assembleFossDebug assembleFullDebug

      # Keep the built debug APKs so they can be downloaded from the run's
      # "Artifacts" section and sideloaded onto an Android device (API 31+).
      # Debug-signed with the repo's own fixed app/keystore/debug.keystore
      # (app/build.gradle.kts), not AGP's implicit per-machine one — this
      # runner has no persisted ~/.android/debug.keystore, so without a
      # pinned key every run would sign with a fresh random one and each new
      # APK would conflict with whatever was installed from the last run
      # ("App not installed"). Fine for testing, not for store upload.
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/*-debug.apk
          if-no-files-found: error
